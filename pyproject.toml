[build-system]
requires = ["setuptools>=40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-sparse"
version = "2.0.0"
description = "High-performance OpenCL GPU compute engine for sparse LLM inference (Gather-GEMV & SwiGLU contextual sparsity) on AMD Radeon GPUs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"radeon_sparse" = "python"}
packages = ["radeon_sparse"]

[tool.setuptools.package-data]
radeon_sparse = ["*.dll", "*.so"]
